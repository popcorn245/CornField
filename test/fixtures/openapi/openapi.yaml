openapi: 3.1.0
info:
  title: Pantry API
  version: 1.0.0
servers:
  - url: https://pantry.example.test/api/v1
paths:
  /items:
    get:
      summary: Every item in the pantry
      responses:
        '200': { description: The items }
    post:
      summary: Add an item
      responses:
        '201': { description: Added }
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One item
      responses:
        '200': { description: The item }
    patch:
      responses:
        '200': { description: Changed }
    delete:
      responses:
        '204': { description: Gone }
  /shopping-list:
    put:
      summary: Replace the shopping list
      responses:
        '200': { description: Saved }
