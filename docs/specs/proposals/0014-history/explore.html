<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cornfield history mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
body { margin: 0; }
/* Layout: cornfield's Map view as it is (header, map, node panel), plus a timeline strip along the bottom.
   Tokens are cornfield's own (explorer/tokens.css), dark first, light under the system setting and data-theme. */
:root {
  --ground: #090d16;
  --surface-1: rgba(26, 34, 52, 0.86);
  --surface-2: rgba(30, 41, 59, 0.92);
  --surface-3: rgba(51, 65, 85, 0.9);
  --line: rgba(255, 255, 255, 0.12);
  --line-soft: rgba(255, 255, 255, 0.07);
  --text: #f8fafc;
  --text-2: #cbd5e1;
  --text-3: #9aa9bc;
  --accent: #4f46e5;
  --accent-hover: #6265f1;
  --accent-text: #98a1fa;
  --accent-soft: rgba(98, 101, 241, 0.2);
  --focus: #818cf8;
  --ok: #34d399;
  --warn: #fcd34d;
  --info: #7dd3fc;
  --bad: #fca5a5;
  --edge: rgba(148, 163, 184, 0.16);
  --label: rgba(226, 232, 240, 0.85);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f4f6fa; --surface-1: rgba(255,255,255,0.9); --surface-2: rgba(241,245,249,0.95); --surface-3: rgba(226,232,240,0.95);
    --line: rgba(15,23,42,0.12); --line-soft: rgba(15,23,42,0.07); --text: #0f172a; --text-2: #334155; --text-3: #475569;
    --accent-text: #4f46e5; --accent-soft: rgba(79,70,229,0.12); --focus: #4f46e5; --ok: #046f51; --warn: #854d0e; --info: #03679e; --bad: #b91c1c;
    --edge: rgba(51,65,85,0.16); --label: rgba(15,23,42,0.85); --shadow: 0 8px 28px rgba(15,23,42,0.12); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #f4f6fa; --surface-1: rgba(255,255,255,0.9); --surface-2: rgba(241,245,249,0.95); --surface-3: rgba(226,232,240,0.95);
  --line: rgba(15,23,42,0.12); --line-soft: rgba(15,23,42,0.07); --text: #0f172a; --text-2: #334155; --text-3: #475569;
  --accent-text: #4f46e5; --accent-soft: rgba(79,70,229,0.12); --focus: #4f46e5; --ok: #046f51; --warn: #854d0e; --info: #03679e; --bad: #b91c1c;
  --edge: rgba(51,65,85,0.16); --label: rgba(15,23,42,0.85); --shadow: 0 8px 28px rgba(15,23,42,0.12); color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--font); font-size: 13px; overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface-1); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.brand i { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, #4299e1, #818cf8 50%, #e53e3e); display: block; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg span { padding: 4px 12px; border-radius: 7px; color: var(--text-3); font-size: 12px; }
.seg span.on { background: var(--accent); color: #fff; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 12px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent-hover); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-hover); color: var(--accent-text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.mock-tag { margin-left: auto; font-size: 11px; color: var(--text-3); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 10px; }
.layers { position: relative; }
.layers-menu {
  position: absolute; top: 36px; left: 0; width: 250px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 2px; z-index: 10; backdrop-filter: blur(16px);
}
.layers-menu h4 { margin: 6px 8px 4px; font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.row:hover { background: var(--surface-3); }
.row .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 11px; }
.row .dot { width: 9px; height: 9px; border-radius: 50%; }
.check { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--text-3); display: grid; place-items: center; font-size: 10px; }
.row[aria-checked="true"] .check { background: var(--accent); border-color: var(--accent); color: #fff; }
.row.disabled { opacity: 0.45; cursor: default; }
.new { font-size: 10px; color: var(--accent-text); border: 1px solid var(--accent-hover); border-radius: 999px; padding: 0 6px; }

.stage { position: relative; min-height: 0; overflow: hidden; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#map.dragging { cursor: grabbing; }
.banner {
  position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--accent-hover); box-shadow: var(--shadow); z-index: 3; font-size: 12px;
}
.banner b { color: var(--accent-text); }
.legend {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; background: var(--surface-1); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; font-size: 11px; color: var(--text-2); display: grid; gap: 6px; z-index: 2; max-width: 240px;
}
.legend .ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(148,163,184,0.25), #7dd3fc, #a78bfa, #f472b6); }
.legend .ends { display: flex; justify-content: space-between; color: var(--text-3); }
.stage.with-panel .banner { max-width: calc(100% - 432px); }
@media (max-width: 720px) { .stage.with-panel .banner { max-width: calc(100% - 32px); } }
.counter {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; z-index: 2; text-align: right;
  font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 11px; line-height: 1.5; pointer-events: none;
}
.counter strong { display: block; font-size: 20px; color: var(--text); font-weight: 600; }

aside.panel {
  position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 380px; max-width: calc(100% - 24px);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  backdrop-filter: blur(16px); z-index: 4; display: flex; flex-direction: column; min-height: 0;
}
.panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 4px; }
.panel-head .kind { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; display: flex; gap: 6px; align-items: center; }
.panel-head h2 { margin: 0; font-size: 17px; font-weight: 600; word-break: break-word; }
.panel-head .file { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); word-break: break-all; }
.x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.panel-body { overflow-y: auto; padding: 12px 16px 16px; display: grid; gap: 16px; align-content: start; min-height: 0; }
.panel-body h3 { margin: 0 0 8px; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; gap: 8px; }
.panel-body h3 .n { margin-left: auto; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; }
.fact b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.fact span { color: var(--text-3); font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 11.5px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); cursor: pointer; text-decoration: none; max-width: 100%;
}
.chip:hover { border-color: var(--accent-hover); color: var(--text); }
.chip.spec { border-color: color-mix(in srgb, #a78bfa 55%, transparent); }
.chip.issue { border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.chip.pr { border-color: color-mix(in srgb, var(--info) 50%, transparent); }
.chip.sha { font-family: var(--mono); }
.chip.gap { border-style: dashed; color: var(--text-3); cursor: default; background: none; }
.chip .k { font-weight: 600; }
.chip.on { background: var(--accent-soft); border-color: var(--accent-hover); color: var(--accent-text); }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.trail .arr { color: var(--text-3); font-size: 11px; }
ol.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.hist li { border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; border: 1px solid transparent; }
ol.hist li:hover { background: var(--surface-2); }
ol.hist li.cur { border-color: var(--accent-hover); background: var(--accent-soft); }
ol.hist .meta { display: flex; gap: 8px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
ol.hist .subj { color: var(--text); line-height: 1.4; }
ol.hist .born { color: var(--ok); }
.more { justify-self: start; }
.empty { color: var(--text-3); line-height: 1.5; }
.note { color: var(--text-3); font-size: 11.5px; line-height: 1.5; }

footer.timeline {
  border-top: 1px solid var(--line); background: var(--surface-1); z-index: 5;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px;
}
.tl-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tl-top .when { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.tl-top .what { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-top .what .sha { font-family: var(--mono); color: var(--text-3); margin-right: 6px; }
.tl-top select { height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: 12px; padding: 0 6px; }
.icon-btn { width: 30px; padding: 0; justify-content: center; }
canvas#ticks { width: 100%; height: 44px; display: block; cursor: pointer; touch-action: none; }
.tl-trail { min-height: 24px; }
@media (max-width: 720px) {
  aside.panel { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; bottom: 8px; max-height: 58%; }
  .legend { display: none; }
  .mock-tag { display: none; }
  .tl-top .when { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i aria-hidden="true"></i>cornfield</div>
    <div class="seg" aria-label="View"><span class="on">Map</span><span>Flow</span><span>Work</span></div>
    <div class="layers">
      <button class="btn" id="layersBtn" aria-expanded="false" aria-controls="layersMenu">Layers</button>
      <div class="layers-menu" id="layersMenu" role="menu" hidden>
        <h4>Overlays</h4>
        <button class="row disabled" role="menuitemcheckbox" aria-checked="false" tabindex="-1"><span class="check"></span>Runs in flight</button>
        <button class="row disabled" role="menuitemcheckbox" aria-checked="false" tabindex="-1"><span class="check"></span>Work</button>
        <button class="row disabled" role="menuitemcheckbox" aria-checked="false" tabindex="-1"><span class="check"></span>Words</button>
        <button class="row" id="gitRow" role="menuitemcheckbox" aria-checked="true"><span class="check">✓</span>History <span class="new">new</span><span class="n" id="gitCount"></span></button>
      </div>
    </div>
    <button class="btn" id="replayBtn" aria-pressed="false">Replay</button>
    <span class="mock-tag" id="mockTag">Mock · cornfield's own history</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="map" aria-label="The topology map. Select a node to see its history."></canvas>
    <div class="counter" id="counter"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="legend" id="legend">
      <div><b>History layer</b>: halo size is how often a node changed; colour is how recently.</div>
      <div class="ramp"></div>
      <div class="ends"><span>untouched lately</span><span>this week</span></div>
    </div>
    <aside class="panel" id="panel" hidden aria-live="polite"></aside>
  </div>

  <footer class="timeline">
    <div class="tl-top">
      <button class="btn icon-btn" id="playBtn" aria-label="Play">▶</button>
      <button class="btn icon-btn" id="stepBack" aria-label="One commit back">‹</button>
      <button class="btn icon-btn" id="stepFwd" aria-label="One commit forward">›</button>
      <label class="sr" for="speed" hidden>Speed</label>
      <select id="speed" aria-label="Speed"><option value="900">1×</option><option value="350" selected>2×</option><option value="120">5×</option></select>
      <span class="when" id="when"></span>
      <span class="what" id="what"></span>
      <button class="btn" id="nowBtn">Now</button>
    </div>
    <canvas id="ticks" aria-label="Timeline: one mark per commit. Drag to scrub."></canvas>
    <div class="trail tl-trail" id="tlTrail"></div>
  </footer>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  let D;
  try {
    D = await (await fetch('history.json')).json();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:24px">This mock reads history.json from beside it. Serve the folder, for example <code>npx serve docs/specs/proposals/0014-history</code>, and open it from there.</p>';
    return;
  }
  const REPO = D.repo;
  const C = D.commits, N = D.nodes, last = C.length - 1;
  const byId = new Map(N.map((n) => [n.id, n]));
  const parent = {};
  D.edges.forEach(([f, t, d]) => { if (!d && !parent[t]) parent[t] = f; });
  const kids = {};
  D.edges.forEach(([f, t, d]) => { if (!d) (kids[f] = kids[f] || []).push(t); });

  // ---- state
  const S = {
    t: last,             // the commit the map is at
    playing: false,
    git: true,           // the History layer
    sel: null,           // selected node id
    hover: null,
    pick: null,          // { kind: 'spec'|'commit', id, nodes:Set }
    cam: { x: 0, y: 0, k: 0.3 },
    births: new Map(),   // node id -> performance.now() it was born at, during replay
    pulses: new Map(),   // node id -> time it was touched, during replay
  };

  // ---- helpers
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmtDate = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const kindOf = (c) => (c.subject.match(/^(\w+)[(!:]/) || [])[1] || (c.key ? 'feat' : 'chore');
  const short = (sha) => sha.slice(0, 7);
  const url = {
    commit: (sha) => `${REPO}/commit/${sha}`,
    pr: (n) => `${REPO}/pull/${n}`,
    issue: (n) => `${REPO}/issues/${n}`,
    spec: (id) => `${REPO}/blob/main/${D.specs[id].path}`,
    file: (f, isDir) => `${REPO}/${isDir ? 'tree' : 'blob'}/main/${f}`,
  };
  const alive = (n) => n.born <= S.t;
  const commitsOf = (n) => n.commits.filter((i) => i <= S.t);
  const KIND_COL = () => ({ feat: css('--accent-text'), fix: css('--warn'), docs: css('--info'), test: css('--text-3'), chore: css('--text-3') });

  // ---- traceability: a commit's trail, spec -> issue -> PR -> commit
  function trail(c, opts = {}) {
    const parts = [];
    if (c.specs.length) c.specs.forEach((s) => parts.push(`<a class="chip spec" href="${url.spec(s)}" target="_blank" rel="noopener" data-spec="${s}" title="${esc(D.specs[s].title)}"><span class="k">Spec</span> ${s}</a>`));
    else parts.push(`<span class="chip gap" title="No spec named in this commit">no spec</span>`);
    if (c.issues.length) c.issues.forEach((i) => parts.push(`<a class="chip issue" href="${url.issue(i)}" target="_blank" rel="noopener" title="${esc(D.issues[i] || '')}"><span class="k">Issue</span> #${i}</a>`));
    else parts.push(`<span class="chip gap" title="No issue named in this commit">no issue</span>`);
    if (c.pr) parts.push(`<a class="chip pr" href="${url.pr(c.pr)}" target="_blank" rel="noopener"><span class="k">PR</span> #${c.pr}</a>`);
    parts.push(`<a class="chip sha" href="${url.commit(c.sha)}" target="_blank" rel="noopener" title="Open the commit on GitHub">${short(c.sha)}</a>`);
    return parts.join('<span class="arr" aria-hidden="true">→</span>');
  }

  // ---- canvas
  const map = $('map'), ctx = map.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = map.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    map.width = W * DPR; map.height = H * DPR;
    sizeTicks();
  }
  function fit() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    N.forEach((n) => { x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r); });
    const panelW = !$('panel').hidden && W > 720 ? 400 : 0;
    const k = Math.min((W - panelW - 40) / (x1 - x0), (H - 40) / (y1 - y0));
    S.cam = { k, x: (x0 + x1) / 2 - panelW / 2 / k, y: (y0 + y1) / 2 };
  }
  const toScreen = (x, y) => [(x - S.cam.x) * S.cam.k + W / 2, (y - S.cam.y) * S.cam.k + H / 2];
  const toWorld = (sx, sy) => [(sx - W / 2) / S.cam.k + S.cam.x, (sy - H / 2) / S.cam.k + S.cam.y];

  const easeOutBack = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  // where a node is drawn: during its birth it buds out of its parent, like a cell dividing
  function placeOf(n, now) {
    const b = S.births.get(n.id);
    if (b === undefined) return [n.x, n.y, 1];
    const p = Math.min(1, (now - b) / 900);
    if (p >= 1) { S.births.delete(n.id); return [n.x, n.y, 1]; }
    const par = byId.get(parent[n.id]);
    const ox = par ? par.x : n.x, oy = par ? par.y : n.y;
    const e = easeOutBack(p);
    return [ox + (n.x - ox) * e, oy + (n.y - oy) * e, Math.max(0.05, e)];
  }

  // heat: how often a node changed (by now) and how recently
  function heat(n) {
    const cs = commitsOf(n);
    if (!cs.length) return null;
    const lastI = cs[cs.length - 1];
    const age = (Date.parse(C[S.t].date) - Date.parse(C[lastI].date)) / 86400000;
    return { count: cs.length, age };
  }
  function heatColor(age) {
    // this week -> pink, a fortnight -> violet, a month -> sky, older -> slate
    const stops = [[0, [244, 114, 182]], [10, [167, 139, 250]], [20, [125, 211, 252]], [35, [148, 163, 184]]];
    let a = stops[0], b = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) if (age >= stops[i][0] && age <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; }
    if (age > 35) return `rgba(148,163,184,`;
    const f = (age - a[0]) / (b[0] - a[0] || 1);
    const c = a[1].map((v, i) => Math.round(v + (b[1][i] - v) * f));
    return `rgba(${c[0]},${c[1]},${c[2]},`;
  }

  function draw(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const k = S.cam.k;
    const pick = S.pick ? S.pick.nodes : null;
    const selN = S.sel ? byId.get(S.sel) : null;
    const near = new Set();
    if (selN) { near.add(selN.id); D.edges.forEach(([f, t]) => { if (f === selN.id) near.add(t); if (t === selN.id) near.add(f); }); }
    const pos = new Map();
    N.forEach((n) => { if (alive(n)) pos.set(n.id, placeOf(n, now)); });

    // edges: ownership always, other edges only around the selection
    ctx.lineWidth = 1;
    const edgeCol = css('--edge');
    D.edges.forEach(([f, t, dashed]) => {
      const a = pos.get(f), b = pos.get(t);
      if (!a || !b) return;
      if (dashed && !(selN && (f === selN.id || t === selN.id))) return;
      const [x1, y1] = toScreen(a[0], a[1]), [x2, y2] = toScreen(b[0], b[1]);
      ctx.strokeStyle = selN && (f === selN.id || t === selN.id) ? css('--accent-text') : edgeCol;
      ctx.globalAlpha = (pick && !(pick.has(f) && pick.has(t))) ? 0.25 : (dashed ? 0.6 : 1) * Math.min(a[2], b[2]);
      ctx.setLineDash(dashed ? [3, 4] : []);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // history halos under the nodes
    if (S.git) {
      N.forEach((n) => {
        const p = pos.get(n.id); if (!p) return;
        const h = heat(n); if (!h) return;
        if (pick && !pick.has(n.id)) return;
        const [sx, sy] = toScreen(p[0], p[1]);
        const r = (n.r + 4 + Math.sqrt(h.count) * 5) * k * p[2];
        const col = heatColor(h.age);
        const g = ctx.createRadialGradient(sx, sy, n.r * k * 0.8, sx, sy, r);
        g.addColorStop(0, col + '0.55)'); g.addColorStop(1, col + '0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
      });
    }

    // nodes
    const ringCol = css('--accent-text');
    N.forEach((n) => {
      const p = pos.get(n.id); if (!p) return;
      const [sx, sy] = toScreen(p[0], p[1]);
      const r = Math.max(1.5, n.r * k * p[2]);
      let alpha = 1;
      if (pick && !pick.has(n.id)) alpha = 0.14;
      else if (selN && !near.has(n.id)) alpha = 0.35;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = n.color || '#64748b';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
      // a birth flash
      const b = S.births.get(n.id);
      if (b !== undefined) {
        const q = Math.min(1, (now - b) / 900);
        ctx.strokeStyle = css('--ok'); ctx.lineWidth = 2; ctx.globalAlpha = 1 - q;
        ctx.beginPath(); ctx.arc(sx, sy, r + 6 + q * 18, 0, Math.PI * 2); ctx.stroke();
      }
      // touched by the commit being shown
      const pu = S.pulses.get(n.id);
      if (pu !== undefined) {
        const q = (now - pu) / 1400;
        if (q >= 1) S.pulses.delete(n.id);
        else { ctx.strokeStyle = ringCol; ctx.lineWidth = 2; ctx.globalAlpha = 1 - q; ctx.beginPath(); ctx.arc(sx, sy, r + 3 + q * 12, 0, Math.PI * 2); ctx.stroke(); }
      }
      if (S.sel === n.id || S.hover === n.id) {
        ctx.globalAlpha = 1; ctx.strokeStyle = css('--text'); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, r + 3, 0, Math.PI * 2); ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    // labels: big nodes, or when zoomed in, or picked / selected
    ctx.font = `11px ${css('--font')}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelCol = css('--label');
    const placed = [];
    const order = N.filter((n) => pos.has(n.id)).sort((a, b) => b.r - a.r);
    order.forEach((n) => {
      const p = pos.get(n.id);
      const r = n.r * k * p[2];
      const must = S.sel === n.id || S.hover === n.id;
      if (!must && r < 6 && !(pick && pick.has(n.id) && r > 3)) return;
      if (pick && !pick.has(n.id) && !must) return;
      const [sx, sy] = toScreen(p[0], p[1]);
      const w = ctx.measureText(n.label).width, box = [sx - w / 2 - 2, sy + r + 3, sx + w / 2 + 2, sy + r + 17];
      if (!must && placed.some((q) => !(box[2] < q[0] || box[0] > q[2] || box[3] < q[1] || box[1] > q[3]))) return;
      placed.push(box);
      ctx.fillStyle = labelCol; ctx.globalAlpha = selN && !near.has(n.id) && !must ? 0.4 : 1;
      ctx.fillText(n.label, sx, sy + r + 4);
    });
    ctx.globalAlpha = 1;
  }

  // ---- counters and the commit line
  function updateHud() {
    const c = C[S.t];
    const nodes = N.filter(alive).length;
    const edges = D.edges.filter(([f, t]) => alive(byId.get(f)) && alive(byId.get(t))).length;
    const born = N.filter((n) => n.born === S.t).length;
    $('counter').innerHTML = `<strong>${nodes}</strong>nodes · ${edges} edges<br>commit ${S.t + 1} of ${C.length}${born && S.t ? ` · <span style="color:var(--ok)">+${born} born</span>` : ''}`;
    $('when').textContent = fmtDate(c.date);
    $('what').innerHTML = `<span class="sha">${short(c.sha)}</span>${esc(c.subject)}`;
    $('what').title = c.subject;
    $('tlTrail').innerHTML = trail(c);
    $('nowBtn').hidden = S.t === last;
    $('gitCount').textContent = N.filter((n) => alive(n) && commitsOf(n).length).length;
    drawTicks();
  }

  // ---- go to a commit
  function goTo(i, { animate = false } = {}) {
    i = Math.max(0, Math.min(last, i));
    const prev = S.t;
    S.t = i;
    if (animate && i === prev + 1) {
      const now = performance.now();
      N.forEach((n) => { if (n.born === i && i > 0) S.births.set(n.id, now); });
      C[i].nodes.forEach((id) => { if (byId.get(id).born !== i) S.pulses.set(id, now); });
    } else {
      S.births.clear();
      S.pulses.clear();
      const now = performance.now();
      C[i].nodes.forEach((id) => S.pulses.set(id, now));
    }
    if (S.pick && S.pick.kind === 'commit') pickCommit(i, true);
    if (S.sel && !alive(byId.get(S.sel))) select(null);
    else if (S.sel) renderPanel();
    updateHud();
  }

  // ---- replay
  let timer = null;
  function play(on) {
    S.playing = on;
    $('playBtn').textContent = on ? '❚❚' : '▶';
    $('playBtn').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('replayBtn').setAttribute('aria-pressed', String(on));
    clearTimeout(timer);
    if (!on) return;
    if (S.t >= last) goTo(0);
    const tick = () => {
      if (!S.playing) return;
      if (S.t >= last) { play(false); return; }
      goTo(S.t + 1, { animate: true });
      timer = setTimeout(tick, +$('speed').value);
    };
    timer = setTimeout(tick, 400);
  }
  $('playBtn').onclick = () => play(!S.playing);
  $('replayBtn').onclick = () => { if (S.playing) { play(false); return; } select(null); clearPick(); goTo(0); play(true); };
  $('stepBack').onclick = () => { play(false); goTo(S.t - 1); };
  $('stepFwd').onclick = () => { play(false); goTo(S.t + 1, { animate: true }); };
  $('nowBtn').onclick = () => { play(false); goTo(last); };

  // ---- the timeline strip
  const ticks = $('ticks'), tctx = ticks.getContext('2d');
  let TW = 0, TH = 44;
  function sizeTicks() { const r = ticks.getBoundingClientRect(); TW = r.width; ticks.width = TW * DPR; ticks.height = TH * DPR; drawTicks(); }
  const tickX = (i) => 6 + (TW - 12) * (C.length === 1 ? 0 : i / last);
  function drawTicks() {
    if (!TW) return;
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.clearRect(0, 0, TW, TH);
    const cols = KIND_COL();
    const maxN = Math.max(...C.slice(1).map((c) => c.nodes.length), 1);
    // month marks
    tctx.font = `10px ${css('--font')}`; tctx.fillStyle = css('--text-3'); tctx.textBaseline = 'bottom';
    let lastLabel = '';
    C.forEach((c, i) => {
      const lab = new Date(c.date + 'T12:00:00Z').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
      const wk = c.date.slice(0, 8) + (c.date.slice(8) < '15' ? '01' : '15');
      if (wk !== lastLabel) { lastLabel = wk; tctx.globalAlpha = 0.9; const lw = tctx.measureText(lab).width; tctx.fillText(lab, Math.min(TW - lw, tickX(i)), TH); }
    });
    C.forEach((c, i) => {
      const x = tickX(i);
      const h = 6 + 22 * Math.sqrt(Math.min(c.nodes.length, maxN) / maxN);
      const isPick = S.pick && S.pick.kind === 'spec' && c.specs.includes(S.pick.id);
      tctx.globalAlpha = i <= S.t ? 1 : 0.3;
      tctx.fillStyle = isPick ? '#a78bfa' : (cols[kindOf(c)] || cols.chore);
      tctx.fillRect(x - 1, 30 - h, isPick ? 3 : 2, h);
    });
    tctx.globalAlpha = 1;
    const x = tickX(S.t);
    tctx.strokeStyle = css('--text'); tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(x, 0); tctx.lineTo(x, 32); tctx.stroke();
    tctx.fillStyle = css('--text'); tctx.beginPath(); tctx.arc(x, 3, 3.5, 0, Math.PI * 2); tctx.fill();
  }
  let scrubbing = false;
  const scrubTo = (ev) => { const r = ticks.getBoundingClientRect(); const i = Math.round(((ev.clientX - r.left - 6) / (TW - 12)) * last); if (i !== S.t) goTo(i); };
  ticks.addEventListener('pointerdown', (e) => { play(false); scrubbing = true; ticks.setPointerCapture(e.pointerId); scrubTo(e); });
  ticks.addEventListener('pointermove', (e) => { if (scrubbing) scrubTo(e); });
  ticks.addEventListener('pointerup', () => { scrubbing = false; });

  // ---- picking: a spec, or a commit, lights the nodes it reached
  function pickSpec(id) {
    const cs = C.map((c, i) => [c, i]).filter(([c, i]) => i <= S.t && c.specs.includes(id));
    const nodes = new Set(cs.flatMap(([c]) => c.nodes));
    S.pick = { kind: 'spec', id, nodes };
    const sp = D.specs[id];
    $('banner').innerHTML = `<span><b>Spec ${id}</b> · ${esc(sp.title.replace(/^\d{4}[:,]?\s*/, '').split(' (')[0])}: ${cs.length} commit${cs.length === 1 ? '' : 's'}, ${nodes.size} node${nodes.size === 1 ? '' : 's'}</span><a class="chip spec" href="${url.spec(id)}" target="_blank" rel="noopener">Open spec</a><button class="btn" id="clearPick">Clear</button>`;
    $('banner').hidden = false;
    $('clearPick').onclick = clearPick;
    drawTicks();
    if (S.sel) renderPanel();
  }
  function pickCommit(i, quiet) {
    const c = C[i];
    S.pick = { kind: 'commit', id: i, nodes: new Set(c.nodes) };
    $('banner').innerHTML = `<span><b>${short(c.sha)}</b> touched ${c.nodes.length} node${c.nodes.length === 1 ? '' : 's'}</span><button class="btn" id="clearPick">Clear</button>`;
    $('banner').hidden = false;
    $('clearPick').onclick = clearPick;
    if (!quiet) drawTicks();
  }
  function clearPick() { S.pick = null; $('banner').hidden = true; drawTicks(); if (S.sel) renderPanel(); }

  // ---- the node panel
  let showAll = false;
  function select(id) {
    S.sel = id; showAll = false;
    $('panel').hidden = !id;
    $('stage').classList.toggle('with-panel', !!id);
    if (id) renderPanel();
  }
  function renderPanel() {
    const n = byId.get(S.sel); if (!n) return;
    const isDir = !/\.[a-z0-9]+$/i.test(n.file || '');
    const cs = commitsOf(n).slice().reverse();
    const specs = [...new Set(cs.flatMap((i) => C[i].specs))];
    const issues = [...new Set(cs.flatMap((i) => C[i].issues))];
    const prs = [...new Set(cs.map((i) => C[i].pr).filter(Boolean))];
    const traced = cs.filter((i) => C[i].specs.length || C[i].issues.length).length;
    const bornC = C[n.born];
    const list = showAll ? cs : cs.slice(0, 12);
    $('panel').innerHTML = `
      <div class="panel-head">
        <div class="kind"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${esc(n.color || '#64748b')}"></span>${esc(n.type)}</div>
        <h2>${esc(n.label)}</h2>
        ${n.file ? `<a class="file" href="${url.file(n.file, isDir)}" target="_blank" rel="noopener">${esc(n.file)}</a>` : ''}
        <button class="x" id="closePanel" aria-label="Close">✕</button>
      </div>
      <div class="panel-body">
        <section>
          <h3>History</h3>
          <div class="facts">
            <div class="fact"><b>${cs.length}</b><span>commits</span></div>
            <div class="fact"><b>${prs.length}</b><span>pull requests</span></div>
            <div class="fact"><b>${cs.length ? Math.round((traced / cs.length) * 100) : 0}%</b><span>traced to a spec or issue</span></div>
          </div>
        </section>
        <section>
          <h3>Specs behind it <span class="n">${specs.length}</span></h3>
          ${specs.length ? `<div class="chips">${specs.map((s) => `<button class="chip spec ${S.pick && S.pick.id === s ? 'on' : ''}" data-pick-spec="${s}" title="Light up every node this spec reached"><span class="k">${s}</span> ${esc(D.specs[s].title.replace(/^\d{4}[:,]?\s*/, '').split(' (')[0])}</button>`).join('')}</div>` : `<p class="empty">No commit to this node names a spec.</p>`}
          ${issues.length ? `<h3 style="margin-top:12px">Issues <span class="n">${issues.length}</span></h3><div class="chips">${issues.map((i) => `<a class="chip issue" href="${url.issue(i)}" target="_blank" rel="noopener" title="${esc(D.issues[i] || '')}">#${i}</a>`).join('')}</div>` : ''}
        </section>
        <section>
          <h3>Commits <span class="n">newest first</span></h3>
          ${cs.length ? `<ol class="hist">${list.map((i) => {
            const c = C[i];
            return `<li data-commit="${i}" class="${i === S.t ? 'cur' : ''}" tabindex="0" title="Move the timeline to this commit and light what else it touched">
              <div class="meta"><span>${fmtDate(c.date)}</span><span>${c.nodes.length} node${c.nodes.length === 1 ? '' : 's'}</span>${i === n.born ? '<span class="born">born here</span>' : ''}</div>
              <div class="subj">${esc(c.subject)}</div>
              <div class="trail">${trail(c)}</div>
            </li>`;
          }).join('')}</ol>${cs.length > list.length ? `<button class="btn more" id="showAll">Show all ${cs.length}</button>` : ''}`
          : `<p class="empty">Nothing in the history touches this node's file yet.</p>`}
        </section>
        <p class="note">Born ${fmtDate(bornC.date)} in <a href="${url.commit(bornC.sha)}" target="_blank" rel="noopener">${short(bornC.sha)}</a>. ${n.born === 0 ? 'It came with the first commit, when cornfield was lifted out of another repo.' : ''}</p>
      </div>`;
    $('closePanel').onclick = () => select(null);
    const sa = $('showAll'); if (sa) sa.onclick = () => { showAll = true; renderPanel(); };
    $('panel').querySelectorAll('[data-pick-spec]').forEach((b) => b.onclick = () => { const s = b.dataset.pickSpec; if (S.pick && S.pick.id === s) clearPick(); else pickSpec(s); renderPanel(); });
    $('panel').querySelectorAll('li[data-commit]').forEach((li) => {
      const go = (e) => { if (e.target.closest('a')) return; play(false); const i = +li.dataset.commit; goTo(i); pickCommit(i); renderPanel(); };
      li.onclick = go; li.onkeydown = (e) => { if (e.key === 'Enter') go(e); };
    });
  }
  // spec chips inside trails pick too, with a modifier-free click
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a.chip.spec[data-spec]');
    if (a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); pickSpec(a.dataset.spec); }
  });

  // ---- map input: pan, zoom, hover, select
  function hit(sx, sy) {
    const [wx, wy] = toWorld(sx, sy);
    let best = null, bd = Infinity;
    N.forEach((n) => {
      if (!alive(n)) return;
      const d = Math.hypot(n.x - wx, n.y - wy);
      const r = Math.max(n.r, 8 / S.cam.k);
      if (d < r && d < bd) { bd = d; best = n.id; }
    });
    return best;
  }
  let drag = null;
  const pointers = new Map();
  map.addEventListener('pointerdown', (e) => {
    map.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
    drag = { x: e.offsetX, y: e.offsetY, cx: S.cam.x, cy: S.cam.y, moved: false, pinch: null };
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag.pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: S.cam.k }; }
  });
  map.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (drag && drag.pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      S.cam.k = Math.max(0.05, Math.min(4, drag.pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / drag.pinch.d));
      drag.moved = true; return;
    }
    if (drag) {
      const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; map.classList.add('dragging'); }
      S.cam.x = drag.cx - dx / S.cam.k; S.cam.y = drag.cy - dy / S.cam.k;
      return;
    }
    const h = hit(e.offsetX, e.offsetY);
    if (h !== S.hover) { S.hover = h; map.style.cursor = h ? 'pointer' : ''; }
  });
  map.addEventListener('pointerup', (e) => {
    pointers.delete(e.pointerId);
    map.classList.remove('dragging');
    if (drag && !drag.moved) {
      const h = hit(e.offsetX, e.offsetY);
      select(h);
      if (!h) clearPick();
    }
    drag = pointers.size ? drag : null;
  });
  map.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [wx, wy] = toWorld(e.offsetX, e.offsetY);
    S.cam.k = Math.max(0.05, Math.min(4, S.cam.k * Math.exp(-e.deltaY * 0.0015)));
    const [nx, ny] = toWorld(e.offsetX, e.offsetY);
    S.cam.x += wx - nx; S.cam.y += wy - ny;
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, select, textarea')) return;
    if (e.key === ' ' && !e.target.closest('button, li')) { e.preventDefault(); play(!S.playing); }
    if (e.key === 'ArrowLeft') { play(false); goTo(S.t - 1); }
    if (e.key === 'ArrowRight') { play(false); goTo(S.t + 1, { animate: true }); }
    if (e.key === 'Escape') { select(null); clearPick(); closeLayers(); }
  });

  // ---- layers menu
  const closeLayers = () => { $('layersMenu').hidden = true; $('layersBtn').setAttribute('aria-expanded', 'false'); };
  $('layersBtn').onclick = (e) => { e.stopPropagation(); const open = $('layersMenu').hidden; $('layersMenu').hidden = !open; $('layersBtn').setAttribute('aria-expanded', String(open)); };
  document.addEventListener('click', (e) => { if (!e.target.closest('.layers')) closeLayers(); });
  $('gitRow').onclick = () => {
    S.git = !S.git;
    $('gitRow').setAttribute('aria-checked', String(S.git));
    $('gitRow').querySelector('.check').textContent = S.git ? '✓' : '';
    $('legend').hidden = !S.git;
  };

  // ---- deep links: #replay, #node-<id>, #spec-<0012>
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === 'replay') { goTo(0); play(true); }
    else if (h.startsWith('node-') && byId.has(h.slice(5))) { play(false); goTo(last); select(h.slice(5)); }
    else if (h.startsWith('spec-') && D.specs[h.slice(5)]) { play(false); goTo(last); pickSpec(h.slice(5)); }
  }

  // ---- go
  resize(); fit();
  window.addEventListener('resize', () => { resize(); });
  goTo(last);
  S.pulses.clear();
  fromHash();
  if (S.sel) fit();
  window.addEventListener('hashchange', fromHash);
  const loop = (now) => { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
