name: pr-title
# A pull request is squash-merged under its title, and semantic-release reads that title to decide the next release
# (release.config.js, RELEASING.md): it has to be a conventional commit header, `type(scope): summary`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The title is a conventional commit
        env:
          # Through the environment, never pasted into the script: a title is text anyone opening a PR writes
          TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/pr-title.js "${TITLE}"
