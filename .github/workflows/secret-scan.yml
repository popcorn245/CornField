name: secret-scan
# gitleaks over the files of every pull request (and main), with the pinned release binary, checksum-verified.
# `gitleaks dir` scans the checkout as it is, so the gate never trips on history.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Pinned so the gate is deterministic. Bump deliberately.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ( cd "${tmp}" && grep " ${tarball}\$" checksums.txt | sha256sum -c - )
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the files
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
