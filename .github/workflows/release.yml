name: release
# A release on every merge to main (RELEASING.md): the tests, then semantic-release works out the version from the
# conventional commit titles since the last tag (release.config.js), tags the merge commit itself v<version> and makes
# the GitHub release with the notes. Nothing is committed back to main (it is locked): the tag is the only record of a
# version. Then, in this same run (a tag pushed with GITHUB_TOKEN starts no other workflow), the image and npm jobs
# check that tag out, set the version in package.json from it, and publish: the Docker image to GHCR and the package
# to npm, as `cornfield` and as `@popcorn245/cornfield`.
#
# OFF until the maintainer turns it on (RELEASING.md):
#   - every job needs the repository variable CORNFIELD_RELEASE = "on"; without it a merge releases nothing;
#   - the npm job publishes with npm trusted publishing (OIDC, no token): each package names this repo and release.yml
#     as its trusted publisher on npmjs.com, or npm refuses the publish;
#   - package.json's prepublishOnly (cli/release-guard.js) refuses any publish that is not this workflow's, for the tag
#     this run made, from the repo root.
#
# semantic-release and its plugins run with npx at the exact versions below; none of them is a dependency of cornfield.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One release at a time, and never one cancelled half way (a tag without its packages)
concurrency:
  group: release
  cancel-in-progress: false

env:
  SEMANTIC_RELEASE: >-
    -p semantic-release@24.2.3
    -p @semantic-release/commit-analyzer@13.0.1
    -p @semantic-release/release-notes-generator@14.0.3
    -p @semantic-release/github@11.0.1
    -p conventional-changelog-conventionalcommits@8.0.0
  # The first tag, made from the 0.1.0 release commit when the repo has no v* tag yet
  BASELINE_TAG: v0.1.0
  BASELINE_COMMIT: 64eec0b

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.CORNFIELD_RELEASE == 'on' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node cli/cornfield.js validate

  version:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag (a tag-only push) and the GitHub release; nothing is pushed to a branch
    outputs:
      tag: ${{ steps.made.outputs.tag }}
      version: ${{ steps.made.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag and commit: semantic-release reads the history since the last one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The baseline tag is there
        run: |
          set -eu
          if [ -z "$(git tag --list 'v*')" ]; then
            test "$(git show "${BASELINE_COMMIT}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" = "${BASELINE_TAG#v}"
            git tag "${BASELINE_TAG}" "${BASELINE_COMMIT}"
            git push origin "refs/tags/${BASELINE_TAG}"
            echo "Made ${BASELINE_TAG} on ${BASELINE_COMMIT}."
          fi
      - name: The tags before
        run: git tag --list 'v*' | sort > "${RUNNER_TEMP}/tags-before"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes ${SEMANTIC_RELEASE} semantic-release
      - id: made
        name: The tag this run made, if any
        run: |
          set -eu
          # Only a tag this run made, on the commit it released: a re-run of a run that already released publishes nothing again
          git tag --list 'v*' | sort > "${RUNNER_TEMP}/tags-after"
          tag="$(comm -13 "${RUNNER_TEMP}/tags-before" "${RUNNER_TEMP}/tags-after" | head -n 1)"
          if [ -n "${tag}" ]; then
            test "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)"
            echo "${tag}" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
            echo "Released ${tag} on $(git rev-parse --short HEAD)."
          else
            echo 'No release: no commit since the last tag calls for one.'
          fi

  image:
    needs: version
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The version, from the tag (main's package.json keeps the version last set by hand)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "${VERSION}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cornfield
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    needs: version
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing: the OIDC token npm exchanges for a short-lived publish token, and provenance
    env:
      CORNFIELD_RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (and Node 22.14 or later, which node-version 22 resolves to)
      - name: npm, at a pinned version that does trusted publishing
        run: |
          npm install -g npm@11.21.0
          npm --version
      - name: The version, from the tag (main's package.json keeps the version last set by hand)
        run: npm version --no-git-tag-version --allow-same-version "${CORNFIELD_RELEASE_TAG#v}"
      - name: The tag is the package's version
        run: test "${CORNFIELD_RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
      # No token: npm finds the job's OIDC token and exchanges it for a short-lived one, and generates provenance by itself
      - name: Publish cornfield
        env:
          CORNFIELD_RELEASE: '1'
        run: npm publish --access public
      - name: Publish @popcorn245/cornfield (the same files under the scoped name)
        env:
          CORNFIELD_RELEASE: '1'
        run: |
          npm pkg set name=@popcorn245/cornfield
          npm publish --access public
