# cornfield as an always-on service, signed in with your forge, behind a reverse proxy that ends TLS.
# Copy this next to your repo's checkout, adjust the paths, and put the values below in a `.env` file beside it
# (never commit that file). docs/deploy.md explains each part.
#
#   CORNFIELD_PUBLIC_URL            the https origin people open, like https://cornfield.example.org
#   CORNFIELD_GITHUB_CLIENT_ID      from the OAuth app's page on the forge (docs/sign-in.md);
#   CORNFIELD_GITHUB_CLIENT_SECRET  for Forgejo use the CORNFIELD_FORGEJO_* pair instead
#   CORNFIELD_SESSION_SECRET        generated by you, once: openssl rand -base64 48
#
# `docker compose up` stops and names the variable when one is missing. Without sign-in cornfield only listens
# on loopback and refuses to start on 0.0.0.0, so this file cannot run unprotected.
services:
  cornfield:
    image: ghcr.io/popcorn245/cornfield:latest
    # build: .            # or build it from a checkout of cornfield
    container_name: cornfield
    restart: unless-stopped
    environment:
      CORNFIELD_HOST: 0.0.0.0     # inside the container; the port is published on the host's loopback below
      CORNFIELD_PORT: 3350
      CORNFIELD_PUBLIC_URL: ${CORNFIELD_PUBLIC_URL:?the https URL people open, like https://cornfield.example.org}
      CORNFIELD_GITHUB_CLIENT_ID: ${CORNFIELD_GITHUB_CLIENT_ID:?the OAuth app's client id (docs/sign-in.md)}
      CORNFIELD_GITHUB_CLIENT_SECRET: ${CORNFIELD_GITHUB_CLIENT_SECRET:?the OAuth app's client secret}
      CORNFIELD_SESSION_SECRET: ${CORNFIELD_SESSION_SECRET:?generate one with openssl rand -base64 48}
    ports:
      # Only the reverse proxy on this machine reaches it. Never publish 3350 on every address: the proxy ends TLS.
      - "127.0.0.1:3350:3350"
    volumes:
      # The repo to map, read-only: cornfield reads the code, topology.json and the proposals
      - ../my-repo:/repo:ro
      # Unpushed proposals in git worktrees are listed too when the config's `worktrees` folder is inside the mount
      # cornfield's own state: cornfield.db (sessions, reviews). A new named volume is created owned by the image's
      # user (node, uid 1000); a bind mount here must be owned by uid 1000 and mode 0700 instead.
      - cornfield-data:/data
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image's health check asks /healthz, which answers without a session.
    #
    # Traefik instead of Caddy: label the service (and drop `ports` when Traefik shares a network with it)
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.cornfield.rule=Host(`cornfield.example.org`)
    #   - traefik.http.routers.cornfield.entrypoints=websecure
    #   - traefik.http.routers.cornfield.tls.certresolver=letsencrypt
    #   - traefik.http.services.cornfield.loadbalancer.server.port=3350

volumes:
  cornfield-data:
