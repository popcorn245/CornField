/* Layout: cornfield's header, then the Work view as an inbox: a queue on the left, the selected item's detail on the right.
   Graph swaps the queue for the lane map (direction A's cleanups assumed). Tokens are cornfield's own, dark first. */
:root {
  --ground: #090d16; --surface-1: rgba(26,34,52,.86); --surface-2: rgba(30,41,59,.92); --surface-3: rgba(51,65,85,.9);
  --line: rgba(255,255,255,.12); --line-soft: rgba(255,255,255,.07);
  --text: #f8fafc; --text-2: #cbd5e1; --text-3: #9aa9bc;
  --accent: #4f46e5; --accent-hover: #6265f1; --accent-text: #98a1fa; --accent-soft: rgba(98,101,241,.2); --focus: #818cf8;
  --ok: #34d399; --warn: #fcd34d; --info: #7dd3fc; --bad: #fca5a5; --warn-soft: rgba(252,211,77,.14); --bad-soft: rgba(252,165,165,.12); --ok-soft: rgba(52,211,153,.12);
  --k-thread: #a78bfa; --k-issue: #eab308; --k-proposal: #2dd4bf; --k-run: #818cf8; --k-pull: #60a5fa; --k-deploy: #4ade80; --k-code: #94a3b8;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ground: #f4f6fa; --surface-1: rgba(255,255,255,.92); --surface-2: rgba(241,245,249,.96); --surface-3: rgba(226,232,240,.96);
  --line: rgba(15,23,42,.12); --line-soft: rgba(15,23,42,.07); --text: #0f172a; --text-2: #334155; --text-3: #475569;
  --accent-text: #4f46e5; --accent-soft: rgba(79,70,229,.12); --focus: #4f46e5; --ok: #046f51; --warn: #854d0e; --info: #03679e; --bad: #b91c1c;
  --warn-soft: rgba(234,179,8,.14); --bad-soft: rgba(185,28,28,.08); --ok-soft: rgba(4,111,81,.1);
  --k-thread: #7c3aed; --k-issue: #ca8a04; --k-proposal: #0d9488; --k-run: #4f46e5; --k-pull: #2563eb; --k-deploy: #16a34a; --k-code: #64748b;
  --shadow: 0 8px 28px rgba(15,23,42,.12); color-scheme: light; } }
:root[data-theme="light"] {
  --ground: #f4f6fa; --surface-1: rgba(255,255,255,.92); --surface-2: rgba(241,245,249,.96); --surface-3: rgba(226,232,240,.96);
  --line: rgba(15,23,42,.12); --line-soft: rgba(15,23,42,.07); --text: #0f172a; --text-2: #334155; --text-3: #475569;
  --accent-text: #4f46e5; --accent-soft: rgba(79,70,229,.12); --focus: #4f46e5; --ok: #046f51; --warn: #854d0e; --info: #03679e; --bad: #b91c1c;
  --warn-soft: rgba(234,179,8,.14); --bad-soft: rgba(185,28,28,.08); --ok-soft: rgba(4,111,81,.1);
  --k-thread: #7c3aed; --k-issue: #ca8a04; --k-proposal: #0d9488; --k-run: #4f46e5; --k-pull: #2563eb; --k-deploy: #16a34a; --k-code: #64748b;
  --shadow: 0 8px 28px rgba(15,23,42,.12); color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font: 13px/1.45 var(--font); overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  border-bottom: 1px solid var(--line); background: var(--surface-1); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.brand i { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg,#4299e1,#818cf8 50%,#e53e3e); display: block; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; color: var(--text-3); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button.fake { cursor: default; }
.badge { min-width: 18px; height: 18px; border-radius: 9px; background: #facc15; color: #111; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 5px; font-variant-numeric: tabular-nums; }
.vr { width: 1px; height: 20px; background: var(--line); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 12px; white-space: nowrap; }
.btn:hover { border-color: var(--accent-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.big { height: 36px; padding: 0 16px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.search { margin-left: auto; height: 30px; width: 220px; max-width: 40vw; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; font-size: 12px; }
.mock-tag { font-size: 11px; color: var(--text-3); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; display: inline-flex; align-items: center; gap: 6px; }
.mock-tag select { border: 0; background: var(--surface-3); border-radius: 999px; font-size: 11px; padding: 2px 6px; }

main { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(340px, 440px) 1fr; }
main.graph { grid-template-columns: 1fr 420px; }

/* the queue */
.queue { border-right: 1px solid var(--line); background: var(--surface-1); overflow-y: auto; min-height: 0; padding: 8px 0 40px; }
.qhead { padding: 10px 16px 6px; display: flex; align-items: baseline; gap: 8px; }
.qhead h1 { margin: 0; font-size: 15px; font-weight: 600; }
.qhead .sub { color: var(--text-3); font-size: 12px; }
.group { margin-top: 8px; }
.group > button.gh { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 16px 6px; cursor: pointer;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.group > button.gh:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.gh .n { font-variant-numeric: tabular-nums; }
.gh .chev { margin-left: auto; transition: transform .15s; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed ul { display: none; }
.gh .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-3); opacity: .8; }
.group.waiting .gh { color: var(--warn); }
ul.rows { list-style: none; margin: 0; padding: 0 8px; display: grid; gap: 2px; }
li.item { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: start; padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; position: relative; }
li.item:hover { background: var(--surface-2); }
li.item.sel { background: var(--accent-soft); border-color: var(--accent-hover); }
li.item.gone { opacity: .45; }
li.item .glyph { grid-row: span 2; padding-top: 1px; }
li.item .t { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li.item .ref { color: var(--text-3); font-weight: 400; margin-right: 4px; font-variant-numeric: tabular-nums; }
li.item .why { grid-column: 2; color: var(--text-2); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li.item .why.bad { color: var(--bad); }
li.item .also { grid-column: 2 / 4; font-size: 12px; color: var(--warn); display: flex; gap: 6px; align-items: center; }
li.item .age { grid-row: 1; grid-column: 3; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
li.item .go { grid-row: 2; grid-column: 3; height: 24px; padding: 0 9px; font-size: 11.5px; opacity: 0; }
li.item:hover .go, li.item.sel .go { opacity: 1; }
@media (hover: none) { li.item .go { opacity: 1; } }
.empty { padding: 28px 16px 8px; display: grid; gap: 6px; justify-items: start; }
.empty b { font-size: 15px; }
.empty span { color: var(--text-3); }

/* detail */
.detail { overflow-y: auto; min-height: 0; padding: 22px clamp(16px, 3vw, 40px) 60px; }
.detail .inner { max-width: 760px; display: grid; gap: 18px; }
.kindline { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.detail h2 { margin: 2px 0 0; font-size: 21px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--text-3); font-size: 12px; }
.pill { border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); }
.pill.waiting { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pill.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.pill.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.ask { border: 1px solid var(--line); background: var(--surface-1); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.ask.waiting { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.ask .q { font-size: 14px; }
.ask .q small { display: block; color: var(--text-3); font-size: 12px; margin-bottom: 2px; }
.ask .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask .then { color: var(--text-3); font-size: 12px; }
.ask textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 8px 10px; }
.sec h3 { margin: 0 0 8px; font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: flex; gap: 8px; }
.sec h3 .n { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.around { border: 1px solid var(--line-soft); border-radius: 14px; background: var(--surface-1); overflow: hidden; }
.around svg { display: block; width: 100%; height: auto; }
.around .cap { padding: 8px 12px; border-top: 1px solid var(--line-soft); display: flex; gap: 12px; align-items: center; color: var(--text-3); font-size: 11.5px; flex-wrap: wrap; }
.around .cap .btn { margin-left: auto; height: 26px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; }
.kv dt { color: var(--text-3); } .kv dd { margin: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); cursor: pointer; }
.chip:hover { border-color: var(--accent-hover); color: var(--text); }
.chip.plain { cursor: default; }
.chip.planned { border-style: dashed; }
.checks { display: flex; gap: 6px; flex-wrap: wrap; }
.mono { font-family: var(--mono); font-size: 12px; }
.faint { color: var(--text-3); }

/* graph (direction A assumed) */
.lanes { overflow: auto; position: relative; min-height: 0; padding: 16px; }
.lanes-in { position: relative; display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)) minmax(190px, 1.2fr); gap: 12px; min-width: 900px; }
.lane { border: 1px solid var(--line-soft); border-radius: 12px; background: color-mix(in srgb, var(--surface-1) 55%, transparent); padding: 10px 8px 14px; display: grid; gap: 8px; align-content: start; min-height: 420px; position: relative; z-index: 1; }
.lane h4 { margin: 0 0 4px; text-align: center; font-size: 11px; color: var(--text-3); letter-spacing: .08em; }
.lane.code { border-style: dashed; }
.gnode { all: unset; box-sizing: border-box; display: grid; justify-items: center; gap: 4px; padding: 6px 4px; border-radius: 10px; cursor: pointer; text-align: center; font-size: 11.5px; color: var(--text-2); }
.gnode:hover { background: var(--surface-2); }
.gnode:focus-visible { outline: 2px solid var(--focus); }
.gnode.dim { opacity: .4; }
.gnode.sel { background: var(--accent-soft); color: var(--text); }
.gnode .cnt { font-size: 10px; color: var(--text-3); }
.cgroup { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; background: var(--surface-2); color: var(--text-2); }
.cgroup.lit { border-color: var(--accent-hover); color: var(--text); }
.cgroup.dim { opacity: .4; }
svg.wires { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.graph .detail { border-left: 1px solid var(--line); background: var(--surface-1); }
.graph .detail .inner { gap: 14px; }
.graph .detail h2 { font-size: 18px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 10px 10px 14px; display: flex; gap: 12px; align-items: center; z-index: 20; max-width: calc(100% - 32px); }
.toast .btn { height: 26px; }
.keys { position: fixed; right: 16px; bottom: 14px; color: var(--text-3); font-size: 11px; z-index: 3; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--surface-2); }
.back { display: none; }

@media (max-width: 760px) {
  main, main.graph { grid-template-columns: 1fr; }
  .queue { border-right: 0; }
  .detail { position: fixed; inset: auto 0 0 0; top: var(--head, 64px); background: var(--ground); z-index: 8; border-top: 1px solid var(--line); box-shadow: var(--shadow); padding-top: 12px; }
  main:not(.open) .detail { display: none; }
  .back { display: inline-flex; justify-self: start; }
  .search, .vr.opt, .keys { display: none; }
  .mock-tag { order: 9; }
  .kv { grid-template-columns: 110px 1fr; }
}
</style>

<script>
(() => {
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let D, NOW, byId, done, sel, closed = new Set(['motion', 'done', 'drafts']), mode = 'inbox', query = '', lastUndo = null;

/* ---------- words ---------- */
const ago = (iso) => {
  const m = Math.max(0, (NOW - Date.parse(iso)) / 60000);
  if (m < 60) return `${Math.round(m)} min`;
  const h = m / 60; if (h < 24) return `${Math.round(h)} h`;
  return `${Math.round(h / 24)} d`;
};
const KIND = { thread: 'Thread', issue: 'Issue', proposal: 'Spec', run: 'Run', pull: 'Pull request', deploy: 'Deploy', code: 'Code' };
const refOf = (it) => it.kind === 'proposal' ? `Spec ${it.slug.slice(0, 4)}` : it.kind === 'run' ? it.short : it.kind === 'pull' ? `PR #${it.number}` : it.kind === 'issue' ? `Issue #${it.number}` : it.kind === 'thread' ? `Thread #${it.number}` : it.kind === 'deploy' ? 'Deploy' : '';
const titleOf = (it) => {
  if (it.kind === 'run') return it.brief || it.title;
  if (it.kind === 'proposal' && it.title.length > 70) return it.title.replace(/\.example\.test/g, '');
  return it.title;
};
function glyph(kind, size = 18, extra = '') {
  const c = `var(--k-${kind})`, h = size / 2;
  const shapes = {
    thread: `<circle cx="${h}" cy="${h}" r="${h - 2}" fill="${c}"/>`,
    issue: `<circle cx="${h}" cy="${h}" r="${h - 2}" fill="${c}"/><rect x="${h - 1.2}" y="${h * .45}" width="2.4" height="${h * .7}" rx="1" fill="#111"/><circle cx="${h}" cy="${h * 1.45}" r="1.3" fill="#111"/>`,
    proposal: `<rect x="${h * .3}" y="${h * .3}" width="${h * 1.4}" height="${h * 1.4}" transform="rotate(45 ${h} ${h})" fill="${c}"/>`,
    run: `<polygon points="${[0, 60, 120, 180, 240, 300].map((a) => { const r = (a - 90) * Math.PI / 180; return `${h + (h - 1.5) * Math.cos(r)},${h + (h - 1.5) * Math.sin(r)}`; }).join(' ')}" fill="${c}"/>`,
    pull: `<rect x="2" y="2" width="${size - 4}" height="${size - 4}" rx="${size * .25}" fill="${c}"/>`,
    deploy: `<rect x="2.5" y="2.5" width="${size - 5}" height="${size - 5}" rx="1.5" fill="${c}"/>`,
    code: `<circle cx="${h}" cy="${h}" r="${h - 4}" fill="none" stroke="${c}" stroke-width="2"/>`,
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" ${extra}>${shapes[kind] || ''}</svg>`;
}

/* ---------- the inbox rules: every row is derived from state, nothing is filed by hand ---------- */
function relsOf(id) { return D.edges.filter((e) => e.from === id || e.to === id); }
function triage(it) {
  // A thread that belongs to a spec folds into the spec (direction A)
  if (it.kind === 'thread' && D.edges.some((e) => e.from === it.id && e.rel === 'discusses')) return null;
  if (done.has(it.id)) return { group: 'done', why: done.get(it.id), act: null };
  const P = (label, verb) => ({ label, verb });
  switch (it.kind) {
    case 'run':
      if (it.waiting) return { group: 'waiting', why: `“${it.note}”`, act: P('Answer', 'answered'), counted: true };
      if (it.state === 'failed') return { group: 'move', why: `Failed: ${it.note}`, bad: true, act: P('Start again', 'started again') };
      if (it.state === 'done' && it.pull) return { group: 'move', why: `Done: PR #${it.pull} is ready. ${it.note}`, act: P(`Land PR #${it.pull}`, 'landed') };
      if (it.open) return { group: 'motion', why: it.note ? `${cap(it.state)}: ${it.note}` : `${cap(it.state)}, ${it.profile ? `profile ${it.profile}, ` : ''}no report yet`, act: P('Stop', 'stopped') };
      return { group: 'done', why: it.note || cap(it.state), act: null };
    case 'proposal':
      if (it.state === 'to-decide') return { group: 'waiting', why: `Ready for your decision${it.checks ? `, ${checkWords(it.checks)}` : ''}`, act: P('Review', 'approved'), counted: true };
      if (it.state === 'changed') return { group: 'waiting', why: 'Changed since you approved it: review the difference', act: P('Review the change', 'approved again'), counted: true };
      if (it.state === 'approved') return { group: 'move', why: 'Approved. Landing it merges the spec and opens its build issue', act: P('Land it', 'landed') };
      if (it.state === 'approved-unbuilt') return it.partly ? { group: 'move', why: 'Steps 1 to 5 built; the rest waits on your call on a second embed key', act: P('Open the spec', 'opened') } : { group: 'move', why: 'Approved and merged; nothing is building it yet', act: P('Start the build', 'build started') };
      if (it.state === 'sent-back') return { group: 'motion', why: 'You sent it back; with the agent until it pushes', act: null };
      if (it.state === 'draft-pr') return { group: 'motion', why: 'Draft pull request; the agent is still writing it', act: null };

      if (it.state === 'merged') return { group: 'done', why: 'Merged', act: null };

const GROUPS = [

function build() {
  const rows = [];
  for (const it of D.items) {
    const t = triage(it); if (!t) continue;
    rows.push({ it, ...t });
  }
  // One row per subject: a run waiting on a spec that also waits on you rides in the spec's row
  for (const r of rows) {

      const host = rows.find((x) => x.it.slug === r.it.refs.proposal && x.group === 'waiting');

  const s = e.target.closest('[data-sel]'); if (s) { e.preventDefault(); select(s.dataset.sel); return; }
  const lk = e.target.closest('g.lk'); if (lk) { select(lk.dataset.id); return; }
  const gn = e.target.closest('.gnode'); if (gn) { select(gn.dataset.id); return; }
  if (e.target.closest('#toGraph')) { setMode('graph'); return; }
  if (e.target.closest('#back')) { $('#main').classList.remove('open'); return; }
});
$('#asInbox').onclick = () => setMode('inbox');
$('#asGraph').onclick = () => setMode('graph');
$('#workTab').onclick = () => setMode('inbox');
$('#dataset').onchange = (e) => load(e.target.value);
$('#search').oninput = (e) => { query = e.target.value.trim(); paintQueue(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  const flat = flatRows(); const i = flat.indexOf(sel);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); select(flat[Math.min(flat.length - 1, i + 1)] || flat[0], false); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); select(flat[Math.max(0, i - 1)] || flat[0], false); }
  else if (e.key === 'Enter' && sel) { e.preventDefault(); act(sel); }
  else if (e.key === 'g') setMode(mode === 'graph' ? 'inbox' : 'graph');
  else if (e.key === 'Escape') $('#main').classList.remove('open');
});
addEventListener('resize', () => { if (mode === 'graph') wires(); });
load('rig');
})();
</script>
</body>
