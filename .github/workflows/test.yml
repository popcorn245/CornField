name: test
# Every pull request and every push to main: the test suite, and cornfield's own map against its code
# (cornfield maps itself; a change that moves the code without `cornfield sync` fails here).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests (vitest)
        run: npm test
      - name: cornfield validate (its own map, schema, drift and proposals)
        run: node cli/cornfield.js validate
      - name: cornfield validate (the sample repo)
        run: node cli/cornfield.js validate --repo test/fixtures/sample
      - name: The package holds only what it should
        run: npm pack --dry-run --json | node -e "const [p] = JSON.parse(require('fs').readFileSync(0, 'utf8')); const bad = p.files.map((f) => f.path).filter((f) => !/^(cli|core|explorer|plugins|server)\/|^(package\.json|README\.md|LICENSE|CHANGELOG\.md)$/.test(f)); if (bad.length) { console.error('Unexpected files in the package:', bad); process.exit(1); } console.log(p.files.length, 'files')"

  # The web components (spec 0011): a package of their own, with its own lockfile; the root package takes no dependency from it and the job above needs none of it
  components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: components/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types of the package's own source
        run: npm run typecheck
      - name: Build (ES modules, tokens.css, type declarations)
        run: npm run build
      - name: Tests in happy-dom, the generated tokens and types, the files of dist and the package, and a host page loading the build from a cornfield server (cross-origin, in headless Chrome)
        run: npm test
      - name: The package holds exactly the files it should (a test holds the list; this prints it, what `npm publish` would send)
        run: npm pack --dry-run
      - name: Tests in headless Chrome (drawing, selection, tokens, hostile CSS, axe, the demo page)
        run: npm run test:browser
      - name: Size budget (gzipped runtime and corn-map with its engine, at most 5% over)
        run: npm run check:size

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image builds
        run: docker build --tag cornfield:ci .
      - name: The image serves its own map, on loopback only
        run: |
          set -eu
          docker run --rm -d --name cf --network host -v "$PWD:/repo:ro" -e CORNFIELD_PORT=3399 cornfield:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3399/cornfield/config.json >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3399/topology.json | node -e "const t = JSON.parse(require('fs').readFileSync(0, 'utf8')); if (!t.nodes.length) process.exit(1); console.log(t.nodes.length, 'nodes')"
          docker rm -f cf
      - name: The image serves the web components it built, and has none of the tools that built them
        run: |
          set -eu
          docker run --rm -d --name cf --network host -v "$PWD:/repo:ro" -e CORNFIELD_PORT=3396 cornfield:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3396/healthz >/dev/null && break; sleep 1; done
          fail() { echo "$1" >&2; docker rm -f cf >/dev/null; exit 1; }
          # version.json says this checkout's version (the release sets it in package.json from the tag before it builds the image)
          want="$(node -p "require('./package.json').version")"
          got="$(curl -fsS http://127.0.0.1:3396/cornfield/components/version.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).cornfield")"
          [ "$got" = "$want" ] || fail "version.json says $got, package.json says $want"
          # corn-map.js is JavaScript, with nosniff, and a shared chunk it imports is served too
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:3396/cornfield/components/corn-map.js)"
          echo "$headers" | grep -iq '^content-type: application/javascript' || fail "corn-map.js is not JavaScript: $headers"
          echo "$headers" | grep -iq '^x-content-type-options: nosniff' || fail 'corn-map.js has no nosniff'
          chunk="$(curl -fsS http://127.0.0.1:3396/cornfield/components/corn-map.js | grep -o 'chunks/[A-Za-z0-9_-]*[.]js' | head -n 1)"
          [ -n "$chunk" ] || fail 'corn-map.js imports no chunk'
          curl -fsS -o /dev/null "http://127.0.0.1:3396/cornfield/components/$chunk"
          # Nothing outside the build: a traversal, the manifest, a folder
          for p in '../../package.json' '..%2f..%2fpackage.json' '%2e%2e/%2e%2e/etc/passwd' manifest.json chunks/ .env; do
            code="$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:3396/cornfield/components/$p")"
            [ "$code" = 404 ] || fail "/cornfield/components/$p answered $code"
          done
          # No Vite, no StencilRS, no node_modules from components/ in the final image
          docker exec cf sh -c 'test -f /opt/cornfield/components/dist/manifest.json && test ! -e /opt/cornfield/components/node_modules && test ! -e /opt/cornfield/components/src && test ! -e /opt/cornfield/node_modules/vite && test ! -e /opt/cornfield/node_modules/@stencil' || fail 'the image holds more of components/ than dist/'
          docker exec cf du -sk /opt/cornfield/components
          docker rm -f cf
      - name: Beyond loopback it refuses, for the right reason, unless sign-in is configured with an https URL
        env:
          # Placeholders: no OAuth app has these, and nothing here signs in
          SIGN_IN: -e CORNFIELD_GITHUB_CLIENT_ID=ci-placeholder-id -e CORNFIELD_GITHUB_CLIENT_SECRET=placeholder -e CORNFIELD_SESSION_SECRET=placeholderplaceholderplaceholder00
        run: |
          set -eu
          refuses() { # $1: the words it must give; the rest: docker run arguments
            words="$1"; shift
            if out=$(docker run --rm -v "$PWD:/repo:ro" -e CORNFIELD_HOST=0.0.0.0 "$@" cornfield:ci serve --repo /repo --port 3398 2>&1); then echo "it listened on 0.0.0.0: $*" >&2; exit 1; fi
            echo "$out" | grep -q "$words" || { echo "refused, but not because $words:" >&2; echo "$out" >&2; exit 1; }
          }
          refuses 'sign-in is not configured'
          refuses 'sign-in is not configured' -e CORNFIELD_PUBLIC_URL=https://cornfield-ci
          refuses 'not https' $SIGN_IN -e CORNFIELD_PUBLIC_URL=http://cornfield-ci
          refuses 'needs both CORNFIELD_GITHUB_CLIENT_ID and CORNFIELD_GITHUB_CLIENT_SECRET' -e CORNFIELD_GITHUB_CLIENT_ID=ci-placeholder-id -e CORNFIELD_PUBLIC_URL=https://cornfield-ci
      - name: With sign-in it listens on 0.0.0.0, and shows nothing without a session
        env:
          SIGN_IN: -e CORNFIELD_GITHUB_CLIENT_ID=ci-placeholder-id -e CORNFIELD_GITHUB_CLIENT_SECRET=placeholder -e CORNFIELD_SESSION_SECRET=placeholderplaceholderplaceholder00
        run: |
          set -eu
          # Hardened as compose.example.yml runs it: read-only root, no capabilities, no new privileges
          docker run --rm -d --name cf -p 127.0.0.1:3397:3397 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -v "$PWD:/repo:ro" -e CORNFIELD_HOST=0.0.0.0 -e CORNFIELD_PORT=3397 -e CORNFIELD_PUBLIC_URL=https://cornfield-ci $SIGN_IN cornfield:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3397/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3397/healthz
          for p in / /topology.json /cornfield/config.json /explorer/main.js /proposals; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3397$p")
            [ "$code" = 401 ] || { echo "$p answered $code without a session" >&2; docker rm -f cf; exit 1; }
          done
          curl -s http://127.0.0.1:3397/ | grep -q 'Sign in with GitHub'
          # …except the web components, which a browser fetches without the cookie (they are the published package); with no embed.origins there is no CORS header
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3397/cornfield/components/version.json)
          [ "$code" = 200 ] || { echo "the components answered $code without a session" >&2; docker rm -f cf; exit 1; }
          if curl -sI -H 'Origin: null' http://127.0.0.1:3397/cornfield/components/corn-map.js | grep -qi '^access-control-'; then echo 'a CORS header with no origin listed' >&2; docker rm -f cf; exit 1; fi
          # Behind a proxy that passes Host through, the public name reaches the guard too
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: cornfield-ci' http://127.0.0.1:3397/topology.json)
          [ "$code" = 401 ] || { echo "the public Host answered $code" >&2; docker rm -f cf; exit 1; }
          # cornfield.db is opened on the first request that looks up a session: ask with a cookie that names none
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cookie: __Host-cornfield=no-such-session' http://127.0.0.1:3397/topology.json)
          [ "$code" = 401 ] || { echo "an unknown session answered $code" >&2; docker rm -f cf; exit 1; }
          # The image runs as a non-root user, and the data folder is that user's, 0700, with cornfield.db 0600 inside
          [ "$(docker exec cf id -u)" != 0 ] || { echo 'the image runs as root' >&2; docker rm -f cf; exit 1; }
          [ "$(docker exec cf stat -c '%U %a' /data)" = 'node 700' ] || { docker exec cf stat -c '%U %a' /data >&2; docker rm -f cf; exit 1; }
          [ "$(docker exec cf stat -c '%U %a' /data/cornfield.db)" = 'node 600' ] || { docker exec cf stat -c '%U %a' /data/cornfield.db >&2; docker rm -f cf; exit 1; }
          # The image's own health check (/healthz, which needs no session) turns healthy
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' cf)" = healthy ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' cf)" = healthy ] || { docker inspect -f '{{json .State.Health}}' cf >&2; docker rm -f cf; exit 1; }
          docker rm -f cf
      - name: The example compose file is valid, and stops without its secrets
        env:
          CORNFIELD_PUBLIC_URL: https://cornfield-ci
          CORNFIELD_GITHUB_CLIENT_ID: ci-placeholder-id
          CORNFIELD_GITHUB_CLIENT_SECRET: placeholder
          CORNFIELD_SESSION_SECRET: placeholderplaceholderplaceholder00
        run: |
          set -eu
          docker compose -f compose.example.yml config --quiet
          if out=$(env -u CORNFIELD_SESSION_SECRET docker compose -f compose.example.yml config 2>&1); then echo 'compose accepted a missing session secret' >&2; exit 1; fi
          echo "$out" | grep -q CORNFIELD_SESSION_SECRET
