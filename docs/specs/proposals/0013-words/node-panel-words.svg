ll="#e6e9f5" font-weight="400" text-anchor="middle">/sessions/:id/restore</text><rect x="774.4" y="527" width="51.199999999999996" height="14" rx="7" fill="#123a3a" stroke="#3dd6c2"/><text x="800" y="537" font-size="9.5" fill="#3dd6c2" font-weight="600" text-anchor="middle">session</text></g></g><rect x="30" y="681" width="10" height="10" rx="3" fill="#8b7cff"/><text x="46" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">service</text><rect x="108.80000000000001" y="681" width="10" height="10" rx="3" fill="#4c8dff"/><text x="124.80000000000001" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">route</text><rect x="174.8" y="681" width="10" height="10" rx="3" fill="#e3b520"/><text x="190.8" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">table</text><rect x="240.8" y="681" width="10" height="10" rx="3" fill="#86c93a"/><text x="256.8" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">job</text><rect x="294" y="681" width="10" height="10" rx="3" fill="#9aa3bd"/><text x="310" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">outside service</text><rect x="424" y="681" width="10" height="10" rx="3" fill="#3dd6c2"/><text x="440" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">word tie</text><rect x="509.2" y="681" width="10" height="10" rx="3" fill="#f5a524"/><text x="525.2" y="690" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">word to avoid</text><rect x="928" y="72" width="376" height="632" rx="12" fill="#121a33" stroke="#26304f"/><text x="944" y="100" font-size="10.5" fill="#97a0bf" font-weight="600" text-anchor="start" letter-spacing="0.9">TABLE</text><text x="944" y="124" font-size="18" fill="#e6e9f5" font-weight="700" text-anchor="start">bills</text><text x="944" y="150" font-size="12.5" fill="#97a0bf" font-weight="400" text-anchor="start">Read by invoices. 0 routes write to it.</text><text x="944" y="186" font-size="10.5" fill="#97a0bf" font-weight="600" text-anchor="start" letter-spacing="0.9">WORDS</text><rect x="944" y="196" width="344" height="104" rx="8" fill="#3a2a12" stroke="#f5a524"/><text x="956" y="218" font-size="12" fill="#f5a524" font-weight="600" text-anchor="start">“bill” is a word to avoid here</text><text x="956" y="240" font-size="12.5" fill="#e6e9f5" font-weight="400" text-anchor="start">This project says Invoice:</text><text x="956" y="258" font-size="12.5" fill="#97a0bf" font-weight="400" text-anchor="start">A request for payment sent to a customer for</text><text x="956" y="274" font-size="12.5" fill="#97a0bf" font-weight="400" text-anchor="start">one period’s charges.</text><text x="956" y="292" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">The glossary (Billing) lists bill under Avoid.</text><text x="944" y="332" font-size="10.5" fill="#97a0bf" font-weight="600" text-anchor="start" letter-spacing="0.9">WHAT YOU CAN DO</text><rect x="944" y="342" width="344" height="34" rx="9" fill="#18213f" stroke="#26304f"/><text x="1116" y="364" font-size="12" fill="#e6e9f5" font-weight="600" text-anchor="middle">Start a thread about this word</text><text x="944" y="398" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">Opens the New idea form, filled in: the title</text><text x="944" y="414" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">“The word bill on bills”, and [[bills]] with</text><text x="944" y="430" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">the word Invoice in the text, both yours to</text><text x="944" y="446" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">change. Nothing opens until you press Open</text><text x="944" y="462" font-size="11.5" fill="#97a0bf" font-weight="400" text-anchor="start">idea. An agent can then grill the word there.</text><text x="944" y="512" font-size="10.5" fill="#97a0bf" font-weight="600" text-anchor="start" letter-spacing="0.9">WORK ON THIS NODE</text><text x="944" y="534" font-size="12.5" fill="#97a0bf" font-weight="400" text-anchor="start">None open.</text></svg>